name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify shipyard v3 golden fixtures
        working-directory: shipyard/fixtures/v3
        run: |
          printf '%s\n' '4043db13b6c473a339fb3cd70616a08454f85675bf5a02a2fb96bd42c301203b  SHA256SUMS' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Lint scaffolding
        run: |
          python -m pip install ruff==0.14.6
          python -m ruff check tools
          python -m ruff format --check tools
      - name: Lint and run tests
        run: |
          python -m ruff check tests
          python -m ruff format --check tests
          python -m unittest discover -s tests -v
      - name: Build placeholder
        run: |
          mkdir -p build
          printf '%s\n' 'Apsis bootstrap build' > build/placeholder.txt
      - name: Placeholder checks
        run: |
          test -s README.md
          test -s LICENSE
          test -s build/placeholder.txt
      - name: Install native sim build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake make g++-13 libssl-dev
      - name: Build and test shipyard
        run: |
          cmake -S shipyard -B build/shipyard -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS=-Werror -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/shipyard --parallel 2
          ctest --test-dir build/shipyard --output-on-failure
      - name: Lint shipyard C++
        run: |
          sudo apt-get install --yes --no-install-recommends clang-tidy-20
          git ls-files -z 'shipyard/src/*.cpp' 'shipyard/tests/*.cpp' | \
            xargs -0 -r clang-tidy-20 -p build/shipyard --warnings-as-errors='*' \
              --header-filter='(^|/)shipyard/(src|include|tests)/'
      - name: Mutation test shipyard (Mull 0.37.0)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-20 libclang-rt-20-dev
          package_dir="$RUNNER_TEMP/shipyard-mull-packages"
          mkdir -p "$package_dir"
          cd "$package_dir"
          curl --fail --location --retry 3 --remote-name https://github.com/mull-project/mull/releases/download/0.37.0/Mull-0.37.0-ubuntu-amd64-24.04.deb
          curl --fail --location --retry 3 --remote-name https://github.com/mull-project/mull/releases/download/0.37.0/Mull-20-0.37.0-LLVM-20.1.2-ubuntu-amd64-24.04.deb
          printf '%s\n' \
            'd8c804720ca494d03d5b25dce4cb898a26089c9745831df161c140739a74d856  Mull-0.37.0-ubuntu-amd64-24.04.deb' \
            '1e43cd585930b42a2164a6a860f9bf7aa46bffed1c355da32360dfc0c427561f  Mull-20-0.37.0-LLVM-20.1.2-ubuntu-amd64-24.04.deb' | sha256sum --check --strict
          sudo apt-get install --yes --no-install-recommends ./Mull-*.deb
          cd "$GITHUB_WORKSPACE"
          python -m ruff check shipyard/mutation.py
          python -m ruff format --check shipyard/mutation.py
          export MULL_CONFIG="$GITHUB_WORKSPACE/shipyard/mull.yml"
          cmake -S shipyard -B "$RUNNER_TEMP/shipyard-mull-build" \
            -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_CXX_FLAGS=-g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-20"
          cmake --build "$RUNNER_TEMP/shipyard-mull-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/shipyard-mull-build" --output-on-failure --parallel 2
          python shipyard/mutation.py "$RUNNER_TEMP/shipyard-mull-build"
      - name: Build and test rescue-debt helper
        env:
          APSIS_RESCUE_DEBT_DRIVER: ${{ runner.temp }}/rescue-debt-build/rescue_debt_seed
        run: |
          cmake -S tools -B "$RUNNER_TEMP/rescue-debt-build" -DCMAKE_CXX_COMPILER=g++-13
          cmake --build "$RUNNER_TEMP/rescue-debt-build" --target rescue_debt_seed --parallel 2
          python -m unittest discover -s tests -p test_rescue_debt_native.py -v
      - name: Build native sim
        id: native_build
        run: |
          cmake -S sim -B "$RUNNER_TEMP/apsis-sim-build" -DCMAKE_CXX_COMPILER=g++-13
          cmake --build "$RUNNER_TEMP/apsis-sim-build" --parallel 2
      - name: Prepare fresh determinism evidence
        id: determinism_prepare
        run: python tools/determinism.py prepare --report-dir "$RUNNER_TEMP"
      - name: Run native layer-1 gates
        id: native_layer1
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/apsis-sim-build/gates" "$GITHUB_WORKSPACE/sim/ref/vectors.txt" 3600 "$RUNNER_TEMP/gates_l1.json"
      - name: Run native world and pilot standing gates
        id: native_standing
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/apsis-sim-build/world_core" gates
          "$RUNNER_TEMP/apsis-sim-build/pilot_gates" gates
          "$RUNNER_TEMP/apsis-sim-build/pilot_gates" switches
          "$RUNNER_TEMP/apsis-sim-build/pilot_gates" endstates
          "$RUNNER_TEMP/apsis-sim-build/pilot_gates" law
      - name: Enforce real-world 1/2/8-thread hashes
        id: world_threads
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.determinism_prepare.outcome == 'success' }}
        run: |
          python tools/determinism.py world --build-dir "$RUNNER_TEMP/apsis-sim-build" --report-dir "$RUNNER_TEMP" --years 300
      - name: Publish native determinism report
        if: ${{ always() }}
        run: |
          python tools/determinism.py report --report-dir "$RUNNER_TEMP" \
            --build-status "${{ steps.native_build.outcome }}" \
            --prepare-status "${{ steps.determinism_prepare.outcome }}" \
            --layer1-status "${{ steps.native_layer1.outcome }}" \
            --standing-status "${{ steps.native_standing.outcome }}" \
            --world-status "${{ steps.world_threads.outcome }}"
      - name: Build and test native viewer adapter
        env:
          APSIS_VIEWER_EXPORT: ${{ runner.temp }}/apsis-viewer-export
          APSIS_VIEWER_OBSERVATIONS: ${{ runner.temp }}/apsis-viewer-observations
        run: |
          g++-13 -std=c++23 -O2 -fno-exceptions -Isim/src \
            tools/viewer/export.cpp \
            "$RUNNER_TEMP/apsis-sim-build/libapsis_pilot.a" \
            "$RUNNER_TEMP/apsis-sim-build/libapsis_world.a" \
            -o "$APSIS_VIEWER_EXPORT"
          g++-13 -std=c++23 -O2 -fno-exceptions -Isim/src \
            tests/viewer_observations.cpp \
            "$RUNNER_TEMP/apsis-sim-build/libapsis_pilot.a" \
            "$RUNNER_TEMP/apsis-sim-build/libapsis_world.a" \
            -o "$APSIS_VIEWER_OBSERVATIONS"
          python -m unittest discover -s tests -p test_viewer_export.py -v
      - name: Lint galaxy test scripts
        run: |
          python -m ruff check galaxy/tests
          python -m ruff format --check galaxy/tests
      - name: Build and test galaxy
        run: |
          cmake -S galaxy -B build/galaxy -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build/galaxy --parallel 2
          ctest --test-dir build/galaxy --output-on-failure
